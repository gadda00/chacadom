# Netlify build config. NOTE: the canonical deployment is GitHub Pages
# (https://gadda00.github.io/chacadom/). This file keeps a Netlify deploy
# working too — VITE_BASE=/ makes the build emit root-relative asset URLs
# instead of the /chacadom/ subpath that GH Pages needs.
[build]
  # Full parity with the GitHub Pages deploy: prerender every route (status-200
  # HTML + the real 404 page) instead of shipping a bare SPA shell whose deep
  # links unfurl with Home's meta. PRERENDER_ORIGIN picks up Netlify's own URL
  # so canonicals/og:url point at this host rather than the Pages mirror.
  command = "npm run build && PRERENDER_ORIGIN=$URL node scripts/prerender.mjs --base /"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
