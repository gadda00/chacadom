name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for prerendering
        run: npx playwright install chromium --with-deps

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (blocking quality gate)
        run: npx oxlint src

      - name: Unit tests
        run: npm test

      - name: Build (with GitHub Pages base path)
        run: npm run build -- --base=/chacadom/

      - name: Prerender all routes (status-200 HTML for crawlers + social unfurls)
        run: node scripts/prerender.mjs --base /chacadom/

      - name: Refresh sitemap lastmod (build-date freshness)
        run: node scripts/refresh-sitemap.mjs

      - name: SPA fallback (404 page for unknown routes)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
