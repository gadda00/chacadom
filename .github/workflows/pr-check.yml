# PR validation — typecheck + lint + tests on every pull request and push to
# feature branches (previously only main got any checks, and only typecheck).
name: PR checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx oxlint src

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build -- --base=/chacadom/
